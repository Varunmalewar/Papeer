[project]
name = "rag-papeer-project"
version = "0.2.0"
description = "Agentic RAG assistant for research papers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "chromadb>=1.5.9",
    "deepeval>=4.0.0",
    "fastapi>=0.146.0",
    "feedparser>=6.0.12",
    "flashrank>=0.2.10",
    "langchain-classic>=1.0.7",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.3",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.2",
    "langchain-openai>=1.6.7",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.1.10",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "lxml>=6.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.4",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=1.27.2.3",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "qdrant-client>=1.17.1",
    "tavily-python>=0.7.24",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
# Rebuilds PDF tables as markdown on table pages (heavy: torch, ~1.5 GB RAM). Optional.
docling = ["docling>=2", "torch", "torchvision"]

# CPU-only torch: the default Linux wheel pulls ~3 GB of CUDA libraries the API never uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "docling" }]
torchvision = [{ index = "pytorch-cpu", extra = "docling" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
